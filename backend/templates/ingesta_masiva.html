<script>
    function procesarArchivoDirecto() {
        const input = document.getElementById('archivo-excel');
        if (input.files.length === 0) return;

        const reader = new FileReader();
        
        // Opcional: Cambiar el texto del botón para dar feedback
        const btnSubir = document.querySelector(`button[onclick="document.getElementById('archivo-excel').click()"]`);
        const textoOriginal = btnSubir.innerText;
        btnSubir.innerText = "⏳ Procesando...";
        btnSubir.disabled = true;

        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const primeraHoja = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[primeraHoja];
            const jsonFinal = XLSX.utils.sheet_to_json(worksheet);
            
            if (jsonFinal.length === 0) {
                alert("El archivo está vacío o no se pudo leer.");
                btnSubir.innerText = textoOriginal;
                btnSubir.disabled = false;
                return;
            }

            // Enviar directo al backend
            fetch("{% url 'api_ingesta_masiva' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(jsonFinal)
            })
            .then(response => response.json())
            .then(result => {
                btnSubir.innerText = textoOriginal;
                btnSubir.disabled = false;
                input.value = ""; // Limpiar el input

                if (result.status === 'success') {
                    let mensaje = `✅ Archivo procesado con éxito.\n\n`;
                    mensaje += `Nuevos (A): ${result.reporte.A.length}\n`;
                    mensaje += `Duplicados (B): ${result.reporte.B.length}\n`;
                    mensaje += `Intentos Cliente (C): ${result.reporte.C.length}\n`;
                    mensaje += `Revisión Manual (D): ${result.reporte.D.length}`;
                    alert(mensaje);
                } else {
                    alert("❌ Error: " + result.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("❌ Ocurrió un error de red al procesar el archivo.");
                btnSubir.innerText = textoOriginal;
                btnSubir.disabled = false;
                input.value = "";
            });
        };

        reader.readAsArrayBuffer(input.files[0]);
    }

    // Función para obtener el CSRF de las cookies de Django
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    async function procesarIngesta() {
        luckysheet.exitEditMode();
        let datosHoja = luckysheet.getSheetData();
        let leadsLimpios = [];

        for (let i = 1; i < datosHoja.length; i++) {
            let fila = datosHoja[i];
            if (fila && fila[0] && fila[0].v != null && fila[0].v !== '' && fila[1] && fila[1].v != null && fila[1].v !== '') {
                let lead = {
                    "nombre": fila[0].v,
                    "telefono": fila[1].v,
                    "celular": fila[2] && fila[2].v != null ? fila[2].v : "",
                    "especialidad": fila[3] && fila[3].v != null ? fila[3].v : "",
                    "producto": fila[4] && fila[4].v != null ? fila[4].v : "",
                    "email": fila[5] && fila[5].v != null ? fila[5].v : "",
                    "ubicacion": fila[6] && fila[6].v != null ? fila[6].v : "",
                    "direccion_completa": fila[7] && fila[7].v != null ? fila[7].v : "",
                    "notas": fila[8] && fila[8].v != null ? fila[8].v : ""
                };
                leadsLimpios.push(lead);
            }
        }

        console.log("Datos a enviar:", leadsLimpios);

        // Agregar alert para UI interactiva, aunque se controla por la respuesta del backend
        const csrftoken = getCookie('csrftoken');

        try {
            const response = await fetch('/api/ingesta/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify(leadsLimpios)
            });

            const data = await response.json();

            if (data.status === 'success') {
                let rep = data.reporte;
                let totalGuardados = rep.A.length;
                let htmlMensaje = `
                    <div style="text-align: left; font-size: 0.9em;">
                        <p><b>✅ Nuevos Registrados (Caso A):</b> ${totalGuardados}</p>
                        <p><b>⚠️ Duplicados Activos (Caso B):</b> ${rep.B.length}</p>
                        <p><b>💼 Clientes Históricos (Caso C):</b> ${rep.C.length}</p>
                        <p><b>🔄 Para Revisión Manual (Caso D):</b> ${rep.D.length}</p>
                    </div>
                    <p style="font-size: 0.8em; margin-top: 10px; color: gray;">
                        *Los registros válidos fueron guardados. Los duplicados se ignoraron para mantener la integridad de la base de datos.
                    </p>
                `;

                Swal.fire({
                    title: '¡Procesamiento Completado!',
                    html: htmlMensaje,
                    icon: totalGuardados > 0 ? 'success' : 'info',
                    confirmButtonText: 'Entendido',
                    confirmButtonColor: '#3085d6'
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Limpiar la pantalla recargando de manera limpia
                        window.location.reload();
                    }
                });
            } else {
                Swal.fire('Error', data.error || 'Hubo un problema procesando la ingesta.', 'error');
            }
        } catch (error) {
            console.error("Error de conexión:", error);
            Swal.fire('Error', 'Error de conexión al guardar los leads.', 'error');
        }
    }
</script>

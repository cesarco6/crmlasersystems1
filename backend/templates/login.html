<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Laser Systems - Iniciar Sesión</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="{% static 'images/LOGO-QUANTUM-logochico.webp' %}" alt="Logo CRM Laser Systems" class="logoin">
        <h1>CRM Laser Systems</h1>
      </div>

      <form class="login-form" id="loginForm" method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" placeholder="usuario" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div style="color: red; margin-bottom: 10px; text-align: center;">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <button type="submit" class="btn-login">Iniciar Sesión</button>
      </form>
    </div>
  </div>
</body>

</html>

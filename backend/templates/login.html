<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Laser Systems - Iniciar Sesión</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    // FOUC Prevention
    (function() {
      const savedTheme = localStorage.getItem('crm-theme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>
</head>

<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="{% static 'images/LOGO-QUANTUM-logochico.webp' %}" alt="Logo CRM Laser Systems">
        <h1>CRM Laser Systems</h1>
        <p>Bienvenidos</p>
      </div>

      <form class="login-form" id="loginForm" method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="form-group">
          <!--<label for="username">Usuario</label>-->  
          <input type="text" id="username" name="username" placeholder="usuario/correo electrónico" required>
        </div>

        <div class="form-group">
          <!--<label for="password">Contraseña</label>-->
          <input type="password" id="password" name="password" placeholder="contraseña" required>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <button type="submit" class="btn btn-login">Iniciar Sesión</button>
      </form>
    </div>
  </div>
  <!-- Theme Toggle Button for Login -->
  <button onclick="toggleCrmTheme()" class="btn-theme-toggle" id="themeToggleBtn" style="position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid var(--ers-border); border-radius: 5px; cursor: pointer; color: var(--ers-text-primary);">
    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
  </button>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        const themeIcon = document.getElementById('themeIcon');
        if(themeIcon) {
            if (currentTheme === 'dark') {
                themeIcon.className = 'bi bi-moon-stars-fill';
            } else {
                themeIcon.className = 'bi bi-brightness-high-fill text-warning';
            }
        }
    });

    function toggleCrmTheme() {
        const htmlTag = document.documentElement;
        const currentTheme = htmlTag.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        htmlTag.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('crm-theme', newTheme);
        
        const icon = document.getElementById('themeIcon');
        if (newTheme === 'dark') {
            icon.className = 'bi bi-moon-stars-fill';
        } else {
            icon.className = 'bi bi-brightness-high-fill text-warning';
        }
    }
  </script>
</body>

</html>

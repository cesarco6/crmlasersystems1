<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Laser Systems - Iniciar Sesión</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <style>
    /* Estilos básicos para el login basados en el template original */
    body.login-body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f7f6;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-container {
        width: 100%;
        max-width: 400px;
        padding: 20px;
    }
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    .login-header img {
        max-width: 150px;
        margin-bottom: 15px;
    }
    .login-header h1 {
        font-size: 24px;
        color: #333;
        margin: 0;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #666;
        font-weight: 500;
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
    }
    .btn-login {
        width: 100%;
        padding: 14px;
        background-color: #0056b3;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .btn-login:hover {
        background-color: #004494;
    }
  </style>
</head>

<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="{% static 'images/LOGO-QUANTUM-logochico.webp' %}" alt="Logo CRM Laser Systems" class="logoin">
        <h1>CRM Laser Systems</h1>
      </div>

      <form class="login-form" id="loginForm" method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" placeholder="usuario" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div style="color: red; margin-bottom: 10px; text-align: center;">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <button type="submit" class="btn-login">Iniciar Sesión</button>
      </form>
    </div>
  </div>
</body>

</html>

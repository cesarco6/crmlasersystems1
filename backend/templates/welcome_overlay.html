{% load static %}
<div id="welcome-overlay" class="welcome-overlay" style="display:none;">
    <div class="welcome-content">        
        <img src="{% static 'images/LOGO-QUANTUM-logochico.png' %}" alt="Logo LS" class="img-fluid welcome-logo">
        <h2 class="welcome-title">Bienvenido, {{ request.user.first_name|title|default:"Compañero" }}</h2>
        <p class="welcome-subtitle text-ers-muted">Inicializando tu área de trabajo...</p>
        <div class="welcome-spinner"></div>
    </div>
</div>

<script>
(function () {
    // Ejecutar INMEDIATAMENTE (sin esperar DOMContentLoaded) para evitar cualquier flash
    try {
        const overlay = document.getElementById('welcome-overlay');

        if (sessionStorage.getItem('welcomeShown_ers')) {
            // Ya vio el splash — el overlay permanece oculto, no hay skeleton en navegaciones
            return;
        }

        // Primera visita de la sesión: mostrar el splash
        sessionStorage.setItem('welcomeShown_ers', 'true');
        if (overlay) overlay.style.display = 'flex';
        document.body.classList.add('skeleton-active');

        // Fade-out después de 2.5s
        setTimeout(() => {
            if (overlay) overlay.classList.add('fade-out');
            setTimeout(() => {
                document.body.classList.remove('skeleton-active');
                if (overlay) overlay.style.display = 'none';
            }, 600);
        }, 2500);

        // Failsafe: limpiar todo a los 4.5s en caso de error
        setTimeout(() => {
            document.body.classList.remove('skeleton-active');
            if (overlay) overlay.style.display = 'none';
        }, 4500);

    } catch (e) {
        console.error("Error en welcome_overlay:", e);
    }
})();
</script>
